[package]
name = "archipelago_rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
thiserror = "2.0.12"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = "1.45.0"
# Migrated from tungstenite to ratchet_rs for compressed websocket support
ratchet_rs = { version = "1.2", features = ["split", "deflate"] }
bytes = "1.0"
url = "2.0"

[dev-dependencies]
anyhow = "1.0"
tokio = { version = "1.45.0", features = ["rt", "macros"] }
